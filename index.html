<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBFER IA 360 - Vendas & Entregas</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #E0E0E0; padding: 15px; }
        .header { text-align: center; margin-bottom: 15px; border-bottom: 2px solid #00BCD4; padding-bottom: 10px; }
        .header h1 { color: #00BCD4; font-size: 1.3rem; }
        .card-pedido { background: #1E1E1E; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; }
        .pedido-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; color: #00BCD4; }
        .pedido-cliente { font-size: 1rem; color: #FFF; font-weight: bold; }
        .pedido-detalhe { font-size: 0.85rem; color: #AAA; margin-top: 3px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; padding: 10px; overflow-y: auto; }
        .modal-content { background: #1E1E1E; border: 1px solid #00BCD4; border-radius: 8px; padding: 15px; max-width: 500px; margin: 10px auto; }
        .modal-title { color: #00BCD4; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 12px; font-size: 1.1rem; text-align: center; }
        .field-group { margin-bottom: 10px; }
        .field-group label { display: block; font-size: 0.8rem; color: #AAA; margin-bottom: 3px; }
        .field-group input, .field-group select { width: 100%; padding: 8px; background: #2A2A2A; border: 1px solid #444; color: #FFF; border-radius: 4px; font-size: 0.95rem; }
        .grid-2 { display: table; width: 100%; table-layout: fixed; }
        .grid-col { display: table-cell; padding-right: 5px; }
        .grid-col:last-child { padding-right: 0; padding-left: 5px; }
        .btn { display: block; width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; margin-bottom: 8px; font-size: 0.95rem; }
        .btn-novo { background: #FF9800; color: #000; font-size: 1rem; margin-bottom: 15px; }
        .btn-rota { background: #00C853; color: #FFF; }
        .btn-salvar { background: #00BCD4; color: #000; }
        .btn-fechar { background: #555; color: #FFF; }
    </style>
</head>
<body>
    <div class="header"><h1>📦 JBFER 360 - Gestão Móvel</h1></div>
    <button class="btn btn-novo" onclick="abrirModalNovaVenda()">➕ Nova Venda / Cadastro</button>
    <div id="lista-pedidos"><p style="text-align: center; color: #888;">Carregando vendas...</p></div>

    <!-- MODAL EDIÇÃO DE PEDIDO -->
    <div id="modal-detalhes" class="modal">
        <div class="modal-content">
            <h2 class="modal-title" id="lbl-id-pedido">Alterar Pedido</h2>
            <div class="field-group"><label>Cliente</label><input type="text" id="edit-cliente" readonly></div>
            <div class="field-group"><label>Endereço</label><input type="text" id="edit-endereco" readonly></div>
            <a id="btn-gps" class="btn btn-rota" target="_blank">🗺️ Abrir Rota GPS</a>
            <div class="field-group"><label>Produto</label>
                <select id="edit-produto-combo" onchange="recalcularTotalEdicao()">
                    <option value="GLP 13 KG" data-preco="145.00">GLP 13 KG - R$ 145,00</option>
                    <option value="GLP 45 KG" data-preco="430.00">GLP 45 KG - R$ 430,00</option>
                    <option value="AGUA 20L" data-preco="18.00">AGUA 20L - R$ 18,00</option>
                </select>
            </div>
            <div class="grid-2">
                <div class="grid-col"><div class="field-group"><label>Qtd.</label><input type="number" id="edit-qtd" value="1" min="1" oninput="recalcularTotalEdicao()"></div></div>
                <div class="grid-col"><div class="field-group"><label>Preço Unit. (R$)</label><input type="number" step="0.01" id="edit-preco-unit" oninput="recalcularTotalEdicao()"></div></div>
            </div>
            <div class="grid-2">
                <div class="grid-col"><div class="field-group"><label>Desconto (R$)</label><input type="number" step="0.01" id="edit-desconto" value="0.00" oninput="recalcularTotalEdicao()"></div></div>
                <div class="grid-col"><div class="field-group"><label>Total Líquido (R$)</label><input type="number" step="0.01" id="edit-valor-total" readonly></div></div>
            </div>
            <div class="field-group"><label>Forma de Pagamento</label>
                <select id="edit-pagamento">
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="PIX">PIX</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Vale Mercado">Vale Mercado</option>
                </select>
            </div>
            <button class="btn btn-salvar" onclick="salvarAlteracoes()">💾 Salvar Alterações</button>
            <button class="btn btn-fechar" onclick="fecharModal('modal-detalhes')">Cancelar</button>
        </div>
    </div>

    <!-- MODAL NOVA VENDA / CADASTRO CLIENTE -->
    <div id="modal-nova-venda" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">🛒 Nova Venda / Cliente</h2>
            <div class="field-group"><label>Nome do Cliente *</label><input type="text" id="novo-nome" placeholder="Nome Completo"></div>
            <div class="field-group"><label>Telefone / WhatsApp *</label><input type="text" id="novo-telefone" placeholder="(00) 00000-0000"></div>
            <div class="field-group"><label>Endereço Completo *</label><input type="text" id="novo-endereco" placeholder="Rua, Número"></div>
            <div class="grid-2">
                <div class="grid-col"><div class="field-group"><label>Bairro</label><input type="text" id="novo-bairro"></div></div>
                <div class="grid-col"><div class="field-group"><label>Ponto de Ref.</label><input type="text" id="novo-referencia"></div></div>
            </div>
            <div class="field-group"><label>Produto</label>
                <select id="novo-produto-combo" onchange="recalcularTotalNovo()">
                    <option value="GLP 13 KG" data-preco="145.00">GLP 13 KG - R$ 145,00</option>
                    <option value="GLP 45 KG" data-preco="430.00">GLP 45 KG - R$ 430,00</option>
                    <option value="AGUA 20L" data-preco="18.00">AGUA 20L - R$ 18,00</option>
                </select>
            </div>
            <div class="grid-2">
                <div class="grid-col"><div class="field-group"><label>Qtd.</label><input type="number" id="novo-qtd" value="1" min="1" oninput="recalcularTotalNovo()"></div></div>
                <div class="grid-col"><div class="field-group"><label>Preço Unit. (R$)</label><input type="number" step="0.01" id="novo-preco-unit" value="145.00" oninput="recalcularTotalNovo()"></div></div>
            </div>
            <div class="grid-2">
                <div class="grid-col"><div class="field-group"><label>Desconto (R$)</label><input type="number" step="0.01" id="novo-desconto" value="0.00" oninput="recalcularTotalNovo()"></div></div>
                <div class="grid-col"><div class="field-group"><label>Total (R$)</label><input type="number" step="0.01" id="novo-valor-total" value="145.00" readonly></div></div>
            </div>
            <div class="field-group"><label>Forma de Pagamento</label>
                <select id="novo-pagamento">
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="PIX">PIX</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Vale Mercado">Vale Mercado</option>
                </select>
            </div>
            <button class="btn btn-salvar" onclick="gravarNovaVenda()">🚀 Registrar Venda</button>
            <button class="btn btn-fechar" onclick="fecharModal('modal-nova-venda')">Cancelar</button>
        </div>
    </div>

    <!-- SCRIPT FIREBASE E REGRAS DA APLICAÇÃO -->
    <script>
        const firebaseConfig = { databaseURL: "https://jbfer-deliveryapp-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let idPedidoAtual = null;

        db.ref('pedidos_pendentes').on('value', (snapshot) => {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = '';
            if (!snapshot.exists()) {
                container.innerHTML = '<p style="text-align: center; color: #888;">Nenhum pedido pendente.</p>';
                return;
            }
            snapshot.forEach((childSnapshot) => {
                const p = childSnapshot.val();
                const id = childSnapshot.key;
                const card = document.createElement('div');
                card.className = 'card-pedido';
                card.onclick = () => abrirDetalhes(id, p);
                card.innerHTML = `<div class="pedido-header"><span>#${p.pedido_id || id}</span><span>R$ ${parseFloat(p.valor || 0).toFixed(2)}</span></div>` +
                                 `<div class="pedido-cliente">${p.cliente || 'CLIENTE NÃO INFORMADO'}</div>` +
                                 `<div class="pedido-detalhe">📦 ${p.produtos || 'Sem produto'} | ${p.forma_pagamento || 'A combinar'}</div>` +
                                 `<div class="pedido-detalhe">📍 ${p.endereco || 'Sem endereço'}</div>`;
                container.appendChild(card);
            });
        });

        function recalcularTotalEdicao() {
            const combo = document.getElementById('edit-produto-combo');
            const opt = combo.options[combo.selectedIndex];
            if(opt && opt.dataset.preco && !document.getElementById('edit-preco-unit').value) {
                document.getElementById('edit-preco-unit').value = opt.dataset.preco;
            }
            const qtd = parseFloat(document.getElementById('edit-qtd').value) || 1;
            const unit = parseFloat(document.getElementById('edit-preco-unit').value) || 0;
            const desc = parseFloat(document.getElementById('edit-desconto').value) || 0;
            document.getElementById('edit-valor-total').value = ((qtd * unit) - desc).toFixed(2);
        }

        function recalcularTotalNovo() {
            const combo = document.getElementById('novo-produto-combo');
            const opt = combo.options[combo.selectedIndex];
            if(opt && opt.dataset.preco) {
                document.getElementById('novo-preco-unit').value = opt.dataset.preco;
            }
            const qtd = parseFloat(document.getElementById('novo-qtd').value) || 1;
            const unit = parseFloat(document.getElementById('novo-preco-unit').value) || 0;
            const desc = parseFloat(document.getElementById('novo-desconto').value) || 0;
            document.getElementById('novo-valor-total').value = ((qtd * unit) - desc).toFixed(2);
        }

        function abrirDetalhes(id, data) {
            idPedidoAtual = id;
            document.getElementById('lbl-id-pedido').innerText = 'Alterar Pedido #' + (data.pedido_id || id);
            document.getElementById('edit-cliente').value = data.cliente || '';
            document.getElementById('edit-endereco').value = data.endereco || '';
            document.getElementById('edit-produto-combo').value = data.produtos || 'GLP 13 KG';
            document.getElementById('edit-qtd').value = data.quantidade || 1;
            document.getElementById('edit-preco-unit').value = data.preco_unitario || 145.00;
            document.getElementById('edit-desconto').value = data.desconto || 0.00;
            document.getElementById('edit-valor-total').value = data.valor || 145.00;
            document.getElementById('edit-pagamento').value = data.forma_pagamento || 'Dinheiro';
            const enc = encodeURIComponent(data.endereco || '');
            document.getElementById('btn-gps').href = `https://www.google.com/maps/search/?api=1&query=${enc}`;
            document.getElementById('modal-detalhes').style.display = 'block';
        }

        function abrirModalNovaVenda() { document.getElementById('modal-nova-venda').style.display = 'block'; }
        function fecharModal(id) { document.getElementById(id).style.display = 'none'; }

        function salvarAlteracoes() {
            if (!idPedidoAtual) return;
            const dados = {
                produtos: document.getElementById('edit-produto-combo').value,
                quantidade: parseInt(document.getElementById('edit-qtd').value),
                preco_unitario: parseFloat(document.getElementById('edit-preco-unit').value),
                desconto: parseFloat(document.getElementById('edit-desconto').value),
                valor: parseFloat(document.getElementById('edit-valor-total').value),
                forma_pagamento: document.getElementById('edit-pagamento').value
            };
            db.ref('pedidos_pendentes/' + idPedidoAtual).update(dados)
                .then(() => { alert('Pedido alterado com sucesso!'); fecharModal('modal-detalhes'); })
                .catch((err) => { alert('Erro: ' + err.message); });
        }

        function gravarNovaVenda() {
            const nome = document.getElementById('novo-nome').value;
            const tel = document.getElementById('novo-telefone').value;
            const end = document.getElementById('novo-endereco').value;
            if(!nome || !end) { alert('Preencha Nome e Endereço obrigatoriamente!'); return; }
            const novoId = 'APP_' + Date.now();
            const dadosVenda = {
                pedido_id: novoId,
                cliente: nome,
                telefone: tel,
                endereco: end + (document.getElementById('novo-bairro').value ? ', ' + document.getElementById('novo-bairro').value : ''),
                referencia: document.getElementById('novo-referencia').value,
                produtos: document.getElementById('novo-produto-combo').value,
                quantidade: parseInt(document.getElementById('novo-qtd').value),
                preco_unitario: parseFloat(document.getElementById('novo-preco-unit').value),
                desconto: parseFloat(document.getElementById('novo-desconto').value),
                valor: parseFloat(document.getElementById('novo-valor-total').value),
                forma_pagamento: document.getElementById('novo-pagamento').value,
                status: 'PENDENTE',
                origem: 'MOBILE'
            };
            db.ref('pedidos_pendentes/' + novoId).set(dadosVenda)
                .then(() => { alert('Nova venda registrada com sucesso!'); fecharModal('modal-nova-venda'); })
                .catch((err) => { alert('Erro ao registrar: ' + err.message); });
        }
    </script>
</body>
</html>
