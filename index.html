<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jbfer Delivery 360 - Entregas</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 15px; }
        h2 { color: #00e676; text-align: center; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .btn { background: #00e676; color: #000; border: none; padding: 10px 15px; font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 10px; text-align: center; text-decoration: display: block; }
        .btn-mapa { background: #29b6f6; color: #000; margin-bottom: 10px; }
        input, select { width: 100%; padding: 8px; margin: 5px 0 15px 0; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        label { font-size: 12px; color: #bbb; }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <h2>📦 Jbfer Delivery 360</h2>
    <div id="status-conexao" style="text-align: center; font-size: 11px; color: #888; margin-bottom: 15px;">Conectando ao servidor...</div>

    <div id="lista-pedidos">
        <!-- Os pedidos pendentes aparecem aqui dinamicamente -->
    </div>

    <hr style="border-color: #333; margin: 20px 0;">

    <div class="card">
        <h3>🛵 Lançar Venda na Rua</h3>
        <label>Telefone do Cliente:</label>
        <input type="text" id="rua_fone" placeholder="(42) 99999-9999">
        <label>Nome do Cliente:</label>
        <input type="text" id="rua_nome" placeholder="Nome do Cliente">
        <label>Endereço Completo:</label>
        <input type="text" id="rua_endereco" placeholder="Rua, Número, Bairro">
        <label>Valor Total (R$):</label>
        <input type="number" id="rua_valor" step="0.01" placeholder="0.00">
        <button class="btn" onclick="lancarVendaRua()">Registrar Venda na Rua</button>
    </div>

    <script>
        // Configuração do Firebase conectada ao projeto do usuário
        const firebaseConfig = {
            databaseURL: "https://jbfer-deliveryapp-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById("status-conexao").innerText = "Conectado com Sucesso!";

        // Função para simular carregamento de pedidos do Firebase
        db.ref('pedidos_pendentes').on('value', (snapshot) => {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = '';
            const dados = snapshot.val();
            
            if (!dados) {
                container.innerHTML = '<p style="text-align:center; color:#777;">Nenhum pedido pendente no momento.</p>';
                return;
            }

            Object.keys(dados).forEach(id => {
                const p = dados[id];
                const linkMapa = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.endereco)}`;
                
                container.innerHTML += `
                    <div class="card">
                        <strong>Pedido #${id}</strong><br>
                        <span>Cliente: ${p.cliente}</span><br>
                        <span>Endereço: ${p.endereco}</span><br>
                        <span>Total: R$ ${parseFloat(p.valor).toFixed(2)}</span><br><br>
                        
                        <a href="${linkMapa}" target="_blank" class="btn btn-mapa">🗺️ Abrir Rota (Google Maps)</a>
                        
                        <hr style="border-color:#333;">
                        <label>Valor em Dinheiro (R$):</label>
                        <input type="number" id="dinheiro_${id}" value="0.00" step="0.01">
                        
                        <label>Valor em Pix (R$):</label>
                        <input type="number" id="pix_${id}" value="0.00" step="0.01">

                        <button class="btn" onclick="confirmarBaixa('${id}', ${p.valor})">Confirmar Baixa e Pagamento</button>
                    </div>
                `;
            });
        });

        function confirmarBaixa(idPedido, valorTotal) {
            let dinheiro = parseFloat(document.getElementById(`dinheiro_${idPedido}`).value) || 0;
            let pix = parseFloat(document.getElementById(`pix_${idPedido}`).value) || 0;
            
            if ((dinheiro + pix) <= 0) {
                alert("Informe ao menos uma forma de pagamento!");
                return;
            }

            // Envia a baixa para o Firebase (o Access vai ler isso e processar)
            db.ref(`baixas_realizadas/${idPedido}`).set({
                id_pedido: idPedido,
                dinheiro: dinheiro,
                pix: pix,
                data_baixa: new Date().toISOString()
            }).then(() => {
                // Remove dos pendentes
                db.ref(`pedidos_pendentes/${idPedido}`).remove();
                alert("Baixa enviada com sucesso!");
            });
        }

        function lancarVendaRua() {
            let fone = document.getElementById('rua_fone').value;
            let nome = document.getElementById('rua_nome').value;
            let endereco = document.getElementById('rua_endereco').value;
            let valor = parseFloat(document.getElementById('rua_valor').value) || 0;

            if (!fone || !endereco || valor <= 0) {
                alert("Preencha o telefone, endereço e valor corretamente!");
                return;
            }

            const idVenda = 'rua_' + Date.now();
            db.ref(`vendas_rua/${idVenda}`).set({
                telefone: fone,
                nome: nome,
                endereco: endereco,
                valor: valor,
                data: new Date().toISOString()
            }).then(() => {
                alert("Venda na rua registrada com sucesso!");
                document.getElementById('rua_fone').value = '';
                document.getElementById('rua_nome').value = '';
                document.getElementById('rua_endereco').value = '';
                document.getElementById('rua_valor').value = '';
            });
        }
    </script>
</body>
</html>
