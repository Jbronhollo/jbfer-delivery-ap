<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBFER IA 360 - Vendas & Entregas</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #E0E0E0; padding: 15px; }
        .header { text-align: center; margin-bottom: 15px; border-bottom: 2px solid #00BCD4; padding-bottom: 10px; }
        .header h1 { color: #00BCD4; font-size: 1.3rem; }
        
        .card-pedido { background: #1E1E1E; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .pedido-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; color: #00BCD4; }
        .pedido-cliente { font-size: 1rem; color: #FFF; font-weight: bold; }
        .pedido-detalhe { font-size: 0.85rem; color: #AAA; margin-top: 3px; }
        
        /* Botões de Ação Direta nos Cards */
        .card-actions { display: flex; gap: 8px; margin-top: 10px; border-top: 1px solid #2A2A2A; padding-top: 8px; }
        .btn-card { flex: 1; padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; font-size: 0.85rem; display: inline-block; }
        .btn-card-mapa { background: #00C853; color: #FFF; }
        .btn-card-editar { background: #00BCD4; color: #000; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; padding: 10px; overflow-y: auto; }
        .modal-content { background: #1E1E1E; border: 1px solid #00BCD4; border-radius: 8px; padding: 15px; max-width: 550px; margin: 10px auto; }
        .modal-title { color: #00BCD4; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 12px; font-size: 1.1rem; text-align: center; }
        
        .field-group { margin-bottom: 10px; }
        .field-group label { display: block; font-size: 0.8rem; color: #AAA; margin-bottom: 3px; }
        .field-group input, .field-group select { width: 100%; padding: 8px; background: #2A2A2A; border: 1px solid #444; color: #FFF; border-radius: 4px; font-size: 0.95rem; }
        
        .grid-2 { display: flex; gap: 8px; }
        .grid-2 > div { flex: 1; }

        /* Estilo dos Subformulários (Listas Dinâmicas) */
        .subform-box { background: #181818; border: 1px solid #333; border-radius: 6px; padding: 10px; margin-bottom: 15px; }
        .subform-title { font-size: 0.85rem; font-weight: bold; color: #00BCD4; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .subform-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
        .subform-row select, .subform-row input { padding: 6px; background: #252525; border: 1px solid #444; color: #FFF; border-radius: 4px; font-size: 0.85rem; }
        
        .btn-add { background: #00BCD4; color: #000; border: none; padding: 4px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .btn-del { background: #E53935; color: #FFF; border: none; width: 28px; height: 28px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        .btn { display: block; width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; margin-bottom: 8px; font-size: 0.95rem; }
        .btn-novo { background: #FF9800; color: #000; font-size: 1rem; margin-bottom: 15px; }
        .btn-salvar { background: #00BCD4; color: #000; }
        .btn-fechar { background: #555; color: #FFF; }
        
        .resumo-totais { background: #222; padding: 8px; border-radius: 4px; margin-bottom: 12px; font-size: 0.9rem; text-align: right; border-left: 3px solid #00BCD4; }
    </style>
</head>
<body>
    <div class="header"><h1>📦 JBFER 360 - Gestão Móvel</h1></div>
    <button class="btn btn-novo" onclick="abrirModalNovaVenda()">➕ Nova Venda / Cadastro</button>
    <div id="lista-pedidos"><p style="text-align: center; color: #888;">Carregando vendas...</p></div>

    <!-- MODAL NOVA / EDITAR VENDA -->
    <div id="modal-venda" class="modal">
        <div class="modal-content">
            <h2 class="modal-title" id="modal-titulo">🛒 Registro de Venda</h2>
            
            <div class="field-group"><label>Nome do Cliente *</label><input type="text" id="venda-nome" placeholder="Nome Completo"></div>
            <div class="field-group"><label>Telefone / WhatsApp *</label><input type="text" id="venda-telefone" placeholder="(00) 00000-0000"></div>
            <div class="field-group"><label>Endereço Completo *</label><input type="text" id="venda-endereco" placeholder="Rua, Número"></div>
            
            <div class="grid-2">
                <div class="field-group"><label>Bairro</label><input type="text" id="venda-bairro"></div>
                <div class="field-group"><label>Ponto de Ref.</label><input type="text" id="venda-referencia"></div>
            </div>

            <!-- SUBFORMULÁRIO DE PRODUTOS -->
            <div class="subform-box">
                <div class="subform-title">
                    <span>📦 PRODUTOS DO PEDIDO</span>
                    <button class="btn-add" onclick="adicionarLinhaProduto()">+ Produto</button>
                </div>
                <div id="container-produtos"></div>
            </div>

            <!-- SUBFORMULÁRIO DE PAGAMENTOS -->
            <div class="subform-box">
                <div class="subform-title">
                    <span>💳 FORMAS DE PAGAMENTO</span>
                    <button class="btn-add" onclick="adicionarLinhaPagamento()">+ Pagamento</button>
                </div>
                <div id="container-pagamentos"></div>
            </div>

            <!-- RESUMO DE TOTAIS -->
            <div class="resumo-totais">
                <div>Total Produtos: <b id="lbl-total-produtos">R$ 0,00</b></div>
                <div>Total Pago: <b id="lbl-total-pago" style="color: #00BCD4;">R$ 0,00</b></div>
            </div>

            <button class="btn btn-salvar" onclick="gravarVenda()">🚀 Salvar Pedido</button>
            <button class="btn btn-fechar" onclick="fecharModal('modal-venda')">Cancelar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://jbfer-deliveryapp-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let idPedidoEdicao = null;

        const listaTabelaProdutos = [
            { id: "GLP 13 KG", nome: "GLP 13 KG", preco: 145.00 },
            { id: "GLP 45 KG", nome: "GLP 45 KG", preco: 430.00 },
            { id: "AGUA 20L", nome: "ÁGUA MINERAL 20L", preco: 18.00 }
        ];

        const listaFormasPagamento = ["Dinheiro", "PIX", "Cartão de Crédito", "Cartão de Débito", "Vale Mercado"];

        db.ref('pedidos_pendentes').on('value', (snapshot) => {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = '';
            if (!snapshot.exists()) {
                container.innerHTML = '<p style="text-align: center; color: #888;">Nenhum pedido pendente.</p>';
                return;
            }
            snapshot.forEach((childSnapshot) => {
                const p = childSnapshot.val();
                const id = childSnapshot.key;
                const card = document.createElement('div');
                card.className = 'card-pedido';
                
                // Formatação do resumo visual dos produtos
                let textoProdutos = "";
                if(Array.isArray(p.itens)) {
                    textoProdutos = p.itens.map(i => `${i.qtd}x ${i.produto}`).join(', ');
                } else {
                    textoProdutos = p.produtos || 'Sem produtos';
                }

                // Formatação do resumo visual dos pagamentos
                let textoPagamento = "";
                if(Array.isArray(p.pagamentos)) {
                    textoPagamento = p.pagamentos.map(pg => `${pg.forma} (R$ ${parseFloat(pg.valor).toFixed(2)})`).join(', ');
                } else {
                    textoPagamento = p.forma_pagamento || 'A combinar';
                }

                const enderecoEncoded = encodeURIComponent(p.endereco || '');

                card.innerHTML = 
                    `<div class="pedido-header"><span>#${p.pedido_id || id}</span><span>R$ ${parseFloat(p.valor || 0).toFixed(2)}</span></div>` +
                    `<div class="pedido-cliente">${p.cliente || 'CLIENTE NÃO INFORMADO'}</div>` +
                    `<div class="pedido-detalhe">📦 ${textoProdutos}</div>` +
                    `<div class="pedido-detalhe">💳 ${textoPagamento}</div>` +
                    `<div class="pedido-detalhe">📍 ${p.endereco || 'Sem endereço'}</div>` +
                    `<div class="card-actions">` +
                        `<a class="btn-card btn-card-mapa" href="https://www.google.com/maps/search/?api=1&query=${enderecoEncoded}" target="_blank">🗺️ Rota GPS</a>` +
                        `<button class="btn-card btn-card-editar" onclick="abrirModalEditarVenda('${id}')">✏️ Editar</button>` +
                    `</div>`;
                
                container.appendChild(card);
            });
        });

        function abrirModalNovaVenda() {
            idPedidoEdicao = null;
            document.getElementById('modal-titulo').innerText = '🛒 Nova Venda Multi-Itens';
            document.getElementById('venda-nome').value = '';
            document.getElementById('venda-telefone').value = '';
            document.getElementById('venda-endereco').value = '';
            document.getElementById('venda-bairro').value = '';
            document.getElementById('venda-referencia').value = '';
            
            document.getElementById('container-produtos').innerHTML = '';
            document.getElementById('container-pagamentos').innerHTML = '';
            adicionarLinhaProduto("GLP 13 KG", 1, 145.00);
            adicionarLinhaPagamento("Dinheiro", 145.00);
            document.getElementById('modal-venda').style.display = 'block';
        }

        function abrirModalEditarVenda(id) {
            db.ref('pedidos_pendentes/' + id).once('value').then((snapshot) => {
                if(!snapshot.exists()) return;
                const p = snapshot.val();
                idPedidoEdicao = id;
                
                document.getElementById('modal-titulo').innerText = '✏️ Editar Pedido #' + (p.pedido_id || id);
                document.getElementById('venda-nome').value = p.cliente || '';
                document.getElementById('venda-telefone').value = p.telefone || '';
                document.getElementById('venda-endereco').value = p.endereco || '';
                document.getElementById('venda-bairro').value = p.bairro || '';
                document.getElementById('venda-referencia').value = p.referencia || '';

                document.getElementById('container-produtos').innerHTML = '';
                document.getElementById('container-pagamentos').innerHTML = '';

                // Carrega produtos existentes
                if(Array.isArray(p.itens) && p.itens.length > 0) {
                    p.itens.forEach(item => adicionarLinhaProduto(item.produto, item.qtd, item.preco_unitario));
                } else {
                    adicionarLinhaProduto(p.produtos || "GLP 13 KG", p.quantidade || 1, p.preco_unitario || 145.00);
                }

                // Carrega pagamentos existentes
                if(Array.isArray(p.pagamentos) && p.pagamentos.length > 0) {
                    p.pagamentos.forEach(pag => adicionarLinhaPagamento(pag.forma, pag.valor));
                } else {
                    adicionarLinhaPagamento(p.forma_pagamento || "Dinheiro", p.valor || 145.00);
                }

                document.getElementById('modal-venda').style.display = 'block';
            });
        }

        function fecharModal(id) { document.getElementById(id).style.display = 'none'; }

        // GERENCIAMENTO DE LINHAS DE PRODUTOS
        function adicionarLinhaProduto(prodVal = null, qtdVal = 1, precoVal = null) {
            const container = document.getElementById('container-produtos');
            const row = document.createElement('div');
            row.className = 'subform-row row-produto';
            
            // Opção neutra em branco
            let options = `<option value="">-- Selecione o Produto --</option>`;
            options += listaTabelaProdutos.map(p => `<option value="${p.id}" data-preco="${p.preco}">${p.nome}</option>`).join('');
            
            const precoFormatado = (precoVal !== null && precoVal !== undefined) ? parseFloat(precoVal).toFixed(2) : "";

            row.innerHTML = `
                <select style="flex: 2;" class="prod-select" onchange="atualizarPrecoLinha(this)">${options}</select>
                <input type="number" style="flex: 0.8;" class="prod-qtd" value="${qtdVal}" min="1" oninput="calcularTotais()">
                <input type="number" style="flex: 1;" class="prod-preco" value="${precoFormatado}" placeholder="0,00" step="0.01" oninput="calcularTotais()">
                <button class="btn-del" onclick="removerLinha(this)">X</button>
            `;
            container.appendChild(row);

            const selectElement = row.querySelector('.prod-select');

            if (prodVal) {
                selectElement.value = prodVal;
                if (selectElement.selectedIndex === -1 || selectElement.value !== prodVal) {
                    const strBusca = String(prodVal).toUpperCase();
                    for (let i = 0; i < selectElement.options.length; i++) {
                        const optValue = selectElement.options[i].value.toUpperCase();
                        if (optValue !== "" && (strBusca.includes(optValue) || optValue.includes(strBusca))) {
                            selectElement.selectedIndex = i;
                            break;
                        }
                    }
                }
            } else {
                selectElement.selectedIndex = 0;
            }

            calcularTotais();
        }

        function atualizarPrecoLinha(selectElement) {
            const row = selectElement.closest('.subform-row');
            const opt = selectElement.options[selectElement.selectedIndex];
            if(opt && opt.dataset.preco) {
                row.querySelector('.prod-preco').value = parseFloat(opt.dataset.preco).toFixed(2);
            } else if (selectElement.value === "") {
                row.querySelector('.prod-preco').value = "";
            }
            calcularTotais();
        }

        // GERENCIAMENTO DE LINHAS DE PAGAMENTO
        function adicionarLinhaPagamento(formaVal = null, valorVal = null) {
            const container = document.getElementById('container-pagamentos');
            const row = document.createElement('div');
            row.className = 'subform-row row-pagamento';
            
            let options = listaFormasPagamento.map(f => `<option value="${f}">${f}</option>`).join('');
            
            // Cálculo do Saldo Restante caso o valor não tenha sido passado explicitamente
            let valorDefinido = 0;
            if (valorVal !== null && valorVal !== undefined) {
                valorDefinido = parseFloat(valorVal);
            } else {
                let totalProd = 0;
                document.querySelectorAll('.row-produto').forEach(r => {
                    const q = parseFloat(r.querySelector('.prod-qtd').value) || 0;
                    const p = parseFloat(r.querySelector('.prod-preco').value) || 0;
                    totalProd += (q * p);
                });

                let totalPagAtual = 0;
                document.querySelectorAll('.row-pagamento').forEach(r => {
                    totalPagAtual += parseFloat(r.querySelector('.pag-valor').value) || 0;
                });

                const restante = totalProd - totalPagAtual;
                valorDefinido = restante > 0 ? restante : 0;
            }

            row.innerHTML = `
                <select style="flex: 2;" class="pag-forma">${options}</select>
                <input type="number" style="flex: 1.2;" class="pag-valor" value="${valorDefinido.toFixed(2)}" step="0.01" oninput="calcularTotais()">
                <button class="btn-del" onclick="removerLinha(this)">X</button>
            `;
            container.appendChild(row);
            
            const selectPag = row.querySelector('.pag-forma');
            if(formaVal) {
                selectPag.value = formaVal;
                if(selectPag.selectedIndex === -1) {
                    const strForma = String(formaVal).toUpperCase();
                    for(let i = 0; i < selectPag.options.length; i++) {
                        if(strForma.includes(selectPag.options[i].value.toUpperCase())) {
                            selectPag.selectedIndex = i;
                            break;
                        }
                    }
                }
            }
            calcularTotais();
        }

        function removerLinha(btn) {
            btn.closest('.subform-row').remove();
            calcularTotais();
        }

        function calcularTotais() {
            let totalProd = 0;
            document.querySelectorAll('.row-produto').forEach(row => {
                const qtd = parseFloat(row.querySelector('.prod-qtd').value) || 0;
                const preco = parseFloat(row.querySelector('.prod-preco').value) || 0;
                totalProd += (qtd * preco);
            });

            let totalPag = 0;
            document.querySelectorAll('.row-pagamento').forEach(row => {
                totalPag += parseFloat(row.querySelector('.pag-valor').value) || 0;
            });

            document.getElementById('lbl-total-produtos').innerText = 'R$ ' + totalProd.toFixed(2);
            document.getElementById('lbl-total-pago').innerText = 'R$ ' + totalPag.toFixed(2);
        }

        function gravarVenda() {
            const nome = document.getElementById('venda-nome').value;
            const tel = document.getElementById('venda-telefone').value;
            const end = document.getElementById('venda-endereco').value;
            
            if(!nome || !end) { alert('Preencha Nome e Endereço obrigatoriamente!'); return; }

            // Coleta os Itens
            const itens = [];
            let totalGeralProdutos = 0;
            let temProdutoInvalido = false;

            document.querySelectorAll('.row-produto').forEach(row => {
                const prod = row.querySelector('.prod-select').value;
                const qtd = parseInt(row.querySelector('.prod-qtd').value) || 0;
                const preco = parseFloat(row.querySelector('.prod-preco').value) || 0;
                
                if(!prod || prod === "" || preco <= 0) {
                    temProdutoInvalido = true;
                }
                
                totalGeralProdutos += (qtd * preco);
                itens.push({ produto: prod, qtd: qtd, preco_unitario: preco, total: (qtd * preco) });
            });

            if(temProdutoInvalido || itens.length === 0) { 
                alert('Selecione um produto e informe um preço válido para todas as linhas de produto!'); 
                return; 
            }

            // Coleta os Pagamentos
            const pagamentos = [];
            let totalGeralPagos = 0;

            document.querySelectorAll('.row-pagamento').forEach(row => {
                const forma = row.querySelector('.pag-forma').value;
                const valor = parseFloat(row.querySelector('.pag-valor').value) || 0;
                totalGeralPagos += valor;
                pagamentos.push({ forma: forma, valor: valor });
            });

            // Validação Financeira: O Total Pago precisa ser estritamente igual ao Total de Produtos
            const diferenca = totalGeralProdutos - totalGeralPagos;
            if(Math.abs(diferenca) > 0.01) {
                if(diferenca > 0) {
                    alert('Impossível Salvar! Existe um saldo pendente de R$ ' + diferenca.toFixed(2) + ' nas formas de pagamento.');
                } else {
                    alert('Impossível Salvar! O valor total pago (R$ ' + totalGeralPagos.toFixed(2) + ') excede o valor total dos produtos (R$ ' + totalGeralProdutos.toFixed(2) + ').');
                }
                return;
            }

            const keyId = idPedidoEdicao ? idPedidoEdicao : 'APP_' + Date.now();
            const dadosVenda = {
                pedido_id: keyId,
                cliente: nome,
                telefone: tel,
                endereco: end,
                bairro: document.getElementById('venda-bairro').value,
                referencia: document.getElementById('venda-referencia').value,
                itens: itens,
                pagamentos: pagamentos,
                valor: totalGeralProdutos,
                status: 'PENDENTE',
                origem: 'MOBILE'
            };

            db.ref('pedidos_pendentes/' + keyId).set(dadosVenda)
                .then(() => { 
                    alert('Pedido salvo com sucesso!'); 
                    fecharModal('modal-venda'); 
                })
                .catch((err) => { alert('Erro ao salvar: ' + err.message); });
        }
    </script>
</body>
</html>
