<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBFER IA 360 - Painel de Entregas</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #E0E0E0; padding: 15px; }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #00BCD4; padding-bottom: 10px; }
        .header h1 { color: #00BCD4; font-size: 1.4rem; }
        .card-pedido { background: #1E1E1E; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 12px; cursor: pointer; transition: 0.2s; }
        .card-pedido:hover { border-color: #00BCD4; }
        .pedido-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; color: #00BCD4; }
        .pedido-cliente { font-size: 1.1rem; color: #FFF; margin-bottom: 5px; }
        .pedido-endereco { font-size: 0.9rem; color: #AAA; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; padding: 15px; overflow-y: auto; }
        .modal-content { background: #1E1E1E; border: 1px solid #00BCD4; border-radius: 8px; padding: 20px; max-width: 500px; margin: 20px auto; }
        .modal-title { color: #00BCD4; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; font-size: 1.2rem; }
        .field-group { margin-bottom: 15px; }
        .field-group label { display: block; font-size: 0.85rem; color: #AAA; margin-bottom: 5px; }
        .field-group input, .field-group select { width: 100%; padding: 10px; background: #2A2A2A; border: 1px solid #444; color: #FFF; border-radius: 5px; font-size: 1rem; }
        .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; margin-bottom: 10px; font-size: 1rem; }
        .btn-rota { background: #00C853; color: #FFF; }
        .btn-salvar { background: #00BCD4; color: #000; }
        .btn-fechar { background: #555; color: #FFF; }
    </style>
</head>
<body>
    <div class="header"><h1>📦 Pedidos Pendentes - JBFER 360</h1></div>
    <div id="lista-pedidos"><p style="text-align: center; color: #888;">Aguardando pedidos...</p></div>
    <div id="modal-detalhes" class="modal">
        <div class="modal-content">
            <h2 class="modal-title" id="lbl-id-pedido">Pedido #---</h2>
            <div class="field-group"><label>Cliente</label><input type="text" id="edit-cliente" readonly></div>
            <div class="field-group"><label>Endereço</label><input type="text" id="edit-endereco" readonly></div>
            <a id="btn-gps" class="btn btn-rota" target="_blank">🗺️ Abrir Rota no Google Maps</a>
            <div class="field-group"><label>Produtos (Editável)</label><input type="text" id="edit-produtos"></div>
            <div class="field-group"><label>Valor Total (R$) (Editável)</label><input type="number" step="0.01" id="edit-valor"></div>
            <div class="field-group"><label>Forma de Pagamento (Editável)</label>
                <select id="edit-pagamento">
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="PIX">PIX</option>
                    <option value="Cartão de Crédito">Cartão de Crédito</option>
                    <option value="Cartão de Débito">Cartão de Débito</option>
                    <option value="Vale Mercado">Vale Mercado</option>
                </select>
            </div>
            <button class="btn btn-salvar" onclick="salvarAlteracoes()">💾 Salvar Alterações</button>
            <button class="btn btn-fechar" onclick="fecharModal()">Voltar à Lista</button>
        </div>
    </div>
    <script>
        const firebaseConfig = { databaseURL: "https://jbfer-deliveryapp-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let idPedidoAtual = null;

        db.ref('pedidos_pendentes').on('value', (snapshot) => {
            const container = document.getElementById('lista-pedidos');
            container.innerHTML = '';
            if (!snapshot.exists()) {
                container.innerHTML = '<p style="text-align: center; color: #888;">Nenhum pedido pendente no momento.</p>';
                return;
            }
            snapshot.forEach((childSnapshot) => {
                const p = childSnapshot.val();
                const id = childSnapshot.key;
                const card = document.createElement('div');
                card.className = 'card-pedido';
                card.onclick = () => abrirDetalhes(id, p);
                card.innerHTML = `<div class="pedido-header"><span>#${p.pedido_id || id}</span><span>R$ ${parseFloat(p.valor || 0).toFixed(2)}</span></div><div class="pedido-cliente">${p.cliente || 'CLIENTE NÃO INFORMADO'}</div><div class="pedido-endereco">${p.endereco || 'ENDEREÇO NÃO INFORMADO'}</div>`;
                container.appendChild(card);
            });
        });

        function abrirDetalhes(id, data) {
            idPedidoAtual = id;
            document.getElementById('lbl-id-pedido').innerText = 'Pedido #' + (data.pedido_id || id);
            document.getElementById('edit-cliente').value = data.cliente || '';
            document.getElementById('edit-endereco').value = data.endereco || '';
            document.getElementById('edit-produtos').value = data.produtos || '';
            document.getElementById('edit-valor').value = data.valor || 0;
            document.getElementById('edit-pagamento').value = data.forma_pagamento || 'Dinheiro';
            const enderecoEncoded = encodeURIComponent(data.endereco || '');
            document.getElementById('btn-gps').href = `https://www.google.com/maps/search/?api=1&query=${enderecoEncoded}`;
            document.getElementById('modal-detalhes').style.display = 'block';
        }

        function fecharModal() { 
            document.getElementById('modal-detalhes').style.display = 'none'; 
        }

        function salvarAlteracoes() {
            if (!idPedidoAtual) return;
            const novosDados = {
                produtos: document.getElementById('edit-produtos').value,
                valor: parseFloat(document.getElementById('edit-valor').value),
                forma_pagamento: document.getElementById('edit-pagamento').value
            };
            db.ref('pedidos_pendentes/' + idPedidoAtual).update(novosDados)
                .then(() => { 
                    alert('Pedido atualizado com sucesso!'); 
                    fecharModal(); 
                })
                .catch((err) => { 
                    alert('Erro ao atualizar: ' + err.message); 
                });
        }
    </script>
</body>
</html>
